[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zcode-tui"
version = "0.1.0"
description = "ztui — a terminal agent client that reuses your ZCode model configuration"
requires-python = ">=3.11"
dependencies = ["textual>=0.86", "httpx>=0.27"]

[project.scripts]
ztui = "zcode_tui.main:run"

[tool.setuptools.packages.find]
include = ["zcode_tui*"]
